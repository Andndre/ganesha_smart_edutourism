services:
  penglipuran-app:
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
    depends_on:
      penglipuran-db:
        condition: service_started
        required: true
      penglipuran-redis:
        condition: service_started
        required: true
      penglipuran-ors:
        condition: service_started
        required: false
      penglipuran-libretranslate:
        condition: service_started
        required: false

  penglipuran-ors:
    profiles:
      - optional

  penglipuran-libretranslate:
    profiles:
      - optional


  penglipuran-queue:
    profiles:
      - optional
